# tasks file for lighthouse-role
---
- name: Install Nginx (for Debian/Ubuntu)
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Create directory for LightHouse
  ansible.builtin.file:
    path: "{{ lighthouse_dir }}"
    state: directory
    mode: '0755'

- name: Download LightHouse static
  ansible.builtin.get_url:
    url: "https://github.com/VKCOM/lighthouse/archive/refs/heads/master.tar.gz"
    dest: "/tmp/lighthouse.tar.gz"
    mode: '0644'
    force: false

- name: Unarchive LightHouse
  ansible.builtin.unarchive:
    src: "/tmp/lighthouse.tar.gz"
    dest: "{{ lighthouse_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Deploy Nginx config for LightHouse
  ansible.builtin.template:
    src: lighthouse.j2
    dest: "{{ nginx_conf_dir }}/lighthouse"
    mode: '0644'
  notify: Reload nginx

- name: Enable LightHouse site
  ansible.builtin.file:
    src: "{{ nginx_conf_dir }}/lighthouse"
    dest: /etc/nginx/sites-enabled/lighthouse
    state: link
  notify: Reload nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Start Nginx
  ansible.builtin.command: "nginx"
  failed_when: false
  changed_when: false
